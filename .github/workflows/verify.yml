name: Verify C++ Files

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  prepare-matrix-yosupo:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Find yosupo files
        id: set-matrix
        run: |
          problems=$(grep -r -E '^//@yosupo' --include='*.cpp' ./verify | sed -E 's|^(.*)://@yosupo (.*)$|\2$\1|' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$problems" >> $GITHUB_OUTPUT

  prepare-matrix-yukicoder:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Find yukicoder files
        id: set-matrix
        run: |
          problems=$(grep -r -E '^//@yukicoder' --include='*.cpp' ./verify | sed -E 's|^(.*)://@yukicoder ([^[:space:]]+).*|\2$\1|' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$problems" >> $GITHUB_OUTPUT

  prepare-matrix-aoj:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Find AOJ files
        id: set-matrix
        run: |
          problems=$(grep -r -E '^//@aoj' --include='*.cpp' ./verify | sed -E 's|^(.*)://@aoj ([^[:space:]]+).*|\2$\1|' | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "matrix=$problems" >> $GITHUB_OUTPUT

  yosupo-verify:
    needs: prepare-matrix-yosupo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        problem: ${{ fromJson(needs.prepare-matrix-yosupo.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Extract matrix info
        run: |
          echo "PROBLEM=`echo "${{ matrix.problem }}" | cut -d'$' -f1`" >> $GITHUB_ENV
          echo "FILE=`echo "${{ matrix.problem }}" | cut -d'$' -f2-`" >> $GITHUB_ENV
      - name: Echo filename
        run: echo problem:$PROBLEM,file:$FILE,dir:$DIR
      - name: Clone problems
        run: git clone https://github.com/yosupo06/library-checker-problems.git
      - name: Prepare input files
        run: cd library-checker-problems && ulimit -s unlimited && ./generate.py -p $PROBLEM
      - name: Find problem dir
        run: echo DIR=`find . -path "*/$PROBLEM" -type d` >> $GITHUB_ENV
      - name: Compile target
        run: |
          g++ -std=c++20 -O2 --coverage -I `dirname $FILE` $FILE
      - name: Execute
        run: |
          mkdir -p ./out
          find "$DIR"/in -type f -print0 | xargs -0 -I {} sh -c 'ulimit -s unlimited && echo "executing {}..." && cat "{}" | ./a.out >> "./out/$(basename "{}" .in)"'
          find "$DIR"/in -type f -print0 | xargs -0 -I {} sh -c 'echo "judging {}..." && $DIR/checker $DIR/in/$(basename "{}") $DIR/out/$(basename "{}" .in).out ./out/$(basename "{}" .in)'
      - name: Collect coverage data
        id: collect-coverage
        run: python3 scripts/collect_coverage.py "$PROBLEM" "$FILE"
      - name: Upload coverage data
        if: always() && hashFiles('coverage-data/*.gcov.json.gz') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect-coverage.outputs.artifact_name }}
          path: coverage-data/*.gcov.json.gz
          if-no-files-found: error
          retention-days: 1

  yukicoder-verify:
    needs: prepare-matrix-yukicoder
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        problem: ${{ fromJson(needs.prepare-matrix-yukicoder.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Extract matrix info
        id: extract
        run: |
          PROBLEM=$(echo "${{ matrix.problem }}" | cut -d'$' -f1)
          FILE=$(echo "${{ matrix.problem }}" | cut -d'$' -f2-)
          echo "PROBLEM=$PROBLEM" >> $GITHUB_ENV
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "URL=https://yukicoder.me/problems/no/$PROBLEM" >> $GITHUB_ENV
          echo "problem=$PROBLEM" >> $GITHUB_OUTPUT
      - name: Echo filename
        run: echo problem:$PROBLEM,file:$FILE,url:$URL
      - name: Cache online judge tools packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-online-judge-tools-v1
      - name: Install online judge tools
        run: python3 -m pip install --break-system-packages --upgrade --user online-judge-tools online-judge-api-client
      - name: Cache yukicoder testcases
        id: cache-testcases
        uses: actions/cache@v5
        with:
          path: testcases/${{ steps.extract.outputs.problem }}
          key: yukicoder-testcases-${{ steps.extract.outputs.problem }}-v1
      - name: Download yukicoder testcases via oj
        if: steps.cache-testcases.outputs.cache-hit != 'true'
        env:
          YUKICODER_TOKEN: ${{ secrets.YUKICODER_TOKEN }}
        run: |
          set -eu
          BASE_DIR="testcases/${PROBLEM}"
          : "${YUKICODER_TOKEN:?YUKICODER_TOKEN is required}"
          rm -rf "$BASE_DIR"
          mkdir -p "$BASE_DIR"
          PATH="$HOME/.local/bin:$PATH" oj download "$URL" --system --directory "$BASE_DIR" --yukicoder-token "${YUKICODER_TOKEN}"
      - name: Compile target
        run: |
          g++ -std=c++20 -O2 --coverage -I `dirname $FILE` $FILE
      - name: Run oj test
        run: |
          set -eu
          BASE_DIR="testcases/${PROBLEM}"
          if [ ! -d "$BASE_DIR" ]; then
            echo "error: testcases not found under $BASE_DIR" >&2
            exit 1
          fi

          TEST_DIR=""
          while IFS= read -r -d '' candidate; do
            if ls "$candidate"/*.in > /dev/null 2>&1 && ls "$candidate"/*.out > /dev/null 2>&1; then
              TEST_DIR="$candidate"
              break
            fi
          done < <(find "$BASE_DIR" -type d -print0 | sort -z)

          if [ -z "$TEST_DIR" ]; then
            echo "error: no matching (.in, .out) testcase pairs under $BASE_DIR" >&2
            exit 1
          fi

          echo "using test directory: $TEST_DIR"
          PATH="$HOME/.local/bin:$PATH" oj test -c "./a.out" -d "$TEST_DIR" -t 10 --error 1e-6
      - name: Collect coverage data
        id: collect-coverage
        run: python3 scripts/collect_coverage.py "$PROBLEM" "$FILE"
      - name: Upload coverage data
        if: always() && hashFiles('coverage-data/*.gcov.json.gz') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect-coverage.outputs.artifact_name }}
          path: coverage-data/*.gcov.json.gz
          if-no-files-found: error
          retention-days: 1

  aoj-verify:
    needs: prepare-matrix-aoj
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        problem: ${{ fromJson(needs.prepare-matrix-aoj.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Extract matrix info
        id: extract
        run: |
          PROBLEM=$(echo "${{ matrix.problem }}" | cut -d'$' -f1)
          FILE=$(echo "${{ matrix.problem }}" | cut -d'$' -f2-)
          echo "PROBLEM=$PROBLEM" >> $GITHUB_ENV
          echo "FILE=$FILE" >> $GITHUB_ENV
          echo "URL=https://onlinejudge.u-aizu.ac.jp/problems/$PROBLEM" >> $GITHUB_ENV
          echo "problem=$PROBLEM" >> $GITHUB_OUTPUT
      - name: Cache online judge tools packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-online-judge-tools-v1
      - name: Install online judge tools
        run: python3 -m pip install --break-system-packages --upgrade --user online-judge-tools online-judge-api-client
      - name: Cache AOJ system testcases
        id: cache-testcases
        uses: actions/cache@v5
        with:
          path: testcases/${{ steps.extract.outputs.problem }}
          key: aoj-testcases-${{ steps.extract.outputs.problem }}-v1
      - name: Download AOJ system testcases
        if: steps.cache-testcases.outputs.cache-hit != 'true'
        run: |
          set -eu
          BASE_DIR="testcases/${PROBLEM}"
          mkdir -p "$BASE_DIR"
          PATH="$HOME/.local/bin:$PATH" oj download "$URL" --system --directory "$BASE_DIR"
      - name: Compile target
        run: g++ -std=c++20 -O2 --coverage -I "$(dirname "$FILE")" "$FILE" -o a.out
      - name: Run oj test
        run: |
          set -eu
          BASE_DIR="testcases/${PROBLEM}"
          TEST_DIR=""
          while IFS= read -r -d '' candidate; do
            if ls "$candidate"/*.in > /dev/null 2>&1 && ls "$candidate"/*.out > /dev/null 2>&1; then
              TEST_DIR="$candidate"
              break
            fi
          done < <(find "$BASE_DIR" -type d -print0 | sort -z)
          if [ -z "$TEST_DIR" ]; then
            echo "error: no matching (.in, .out) testcase pairs under $BASE_DIR" >&2
            exit 1
          fi
          PATH="$HOME/.local/bin:$PATH" oj test -c ./a.out -d "$TEST_DIR" -t 10 --error 1e-6
      - name: Collect coverage data
        id: collect-coverage
        run: python3 scripts/collect_coverage.py "$PROBLEM" "$FILE"
      - name: Upload coverage data
        if: always() && hashFiles('coverage-data/*.gcov.json.gz') != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.collect-coverage.outputs.artifact_name }}
          path: coverage-data/*.gcov.json.gz
          if-no-files-found: error
          retention-days: 1

  coverage-summary:
    needs: [yosupo-verify, yukicoder-verify, aoj-verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-data
          merge-multiple: true
      - name: Summarize library coverage
        run: python3 scripts/aggregate_coverage.py coverage-data
